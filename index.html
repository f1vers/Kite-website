<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Discord Bot Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f1117;
            color: white;
            min-height: 100vh;
        }

        nav {
            height: 70px;
            background: #171923;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            border-bottom: 1px solid #252936;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 8px;
            padding: 11px 18px;
            font-size: 14px;
            font-weight: bold;
        }

        .login-btn {
            background: #5865f2;
            color: white;
        }

        .login-btn:hover {
            background: #4752c4;
        }

        #account-area {
            display: flex;
            align-items: center;
        }

        #account-area a {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        #account-area img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            transition: transform 0.2s;
        }

        #account-area img:hover {
            transform: scale(1.08);
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 80px 25px;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 18px;
        }

        .description {
            color: #aeb4c0;
            font-size: 18px;
            line-height: 1.6;
            max-width: 650px;
            margin: 0 auto 35px;
        }

        .dashboard {
            display: none;
            margin-top: 50px;
            background: #171923;
            border: 1px solid #252936;
            border-radius: 15px;
            padding: 30px;
            text-align: left;
        }

        .dashboard h2 {
            margin-bottom: 10px;
        }

        .dashboard p {
            color: #aeb4c0;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            background: #20232e;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            nav {
                padding: 0 15px;
            }

            h1 {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            My Discord Bot
        </div>

        <div class="nav-right">

            <!-- Login button -->
            <button
                id="loginButton"
                class="login-btn"
                onclick="login()"
            >
                Login with Discord
            </button>

            <!-- Discord account avatar appears here after login -->
            <div id="account-area"></div>

        </div>

    </nav>


    <main>

        <h1>
            Discord Bot Dashboard
        </h1>

        <p class="description">
            Manage your Discord bot, view your settings and access your dashboard.
        </p>


        <!-- Dashboard shown after login -->
        <div id="dashboard" class="dashboard">

            <h2>
                Welcome!
            </h2>

            <p id="welcomeText">
                You are logged in with Discord.
            </p>

            <div class="status">

                <strong>
                    Account status:
                </strong>

                <span id="accountStatus">
                    Logged in
                </span>

            </div>

        </div>

    </main>


    <script>

        /*
         * Your Cloudflare Worker
         */
        const API_URL =
            "https://kite-dashboard.lazare12-22.workers.dev";


        /*
         * Discord Login
         */
        function login() {

            window.location.href =
                API_URL + "/auth/discord";

        }


        /*
         * Check if the user is already logged in
         */
        async function checkLogin() {

            try {

                const response = await fetch(
                    API_URL + "/me",
                    {
                        credentials: "include"
                    }
                );


                if (!response.ok) {
                    return;
                }


                const user = await response.json();


                /*
                 * User is not logged in
                 */
                if (!user.loggedIn) {
                    return;
                }


                /*
                 * Hide Login button
                 */
                const loginButton =
                    document.getElementById("loginButton");

                if (loginButton) {
                    loginButton.style.display = "none";
                }


                /*
                 * Account area
                 */
                const accountArea =
                    document.getElementById("account-area");


                /*
                 * Create Discord avatar URL
                 */
                let avatarURL;


                if (user.avatar) {

                    avatarURL =
                        `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=128`;

                } else {

                    avatarURL =
                        `https://cdn.discordapp.com/embed/avatars/${Number(user.id) % 5}.png`;

                }


                /*
                 * Show user's Discord avatar
                 */
                accountArea.innerHTML = `

                    <a
                        href="#"
                        title="${user.username}"
                    >

                        <img
                            src="${avatarURL}"
                            alt="${user.username}"
                        >

                    </a>

                `;


                /*
                 * Show dashboard
                 */
                const dashboard =
                    document.getElementById("dashboard");

                if (dashboard) {
                    dashboard.style.display = "block";
                }


                /*
                 * Update welcome message
                 */
                const welcomeText =
                    document.getElementById("welcomeText");

                if (welcomeText) {

                    welcomeText.textContent =
                        "Logged in as " +
                        user.username +
                        ".";

                }

            } catch (error) {

                console.error(
                    "Login check failed:",
                    error
                );

            }

        }


        /*
         * Run login check when the page loads
         */
        checkLogin();

    </script>

</body>
</html>
```
